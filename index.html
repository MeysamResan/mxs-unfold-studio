<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <meta
      name="description"
      content="Unfold Studio by MaXoS. An interactive collection of objects, explored in three dimensions."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        let theme = 'dark';
        try {
          if (localStorage.getItem('unfold-studio-theme') === 'light') theme = 'light';
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f3f3f3' : '#080808';
      })();
    </script>

    <title>Unfold Studio — An inside perspective</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
